    enabled: true
    severity: warning
  VG002:
    enabled: true
    severity: error
  VG003:
    enabled: true
    severity: error
  VG004:
    enabled: true
    severity: warning
  VG005:
    enabled: true
    severity: warning
  VG006:
    enabled: true
    severity: error
  VG007:
    enabled: true
    severity: error
  VG008:
    enabled: true
    severity: warning
  VG101:
    enabled: true
    severity: error
  VG102:
    enabled: true
    severity: warning
  VG103:
    enabled: true
    severity: warning
  VG104:
    enabled: true
    severity: error
  VG105:
    enabled: true
    severity: error
  VG106:
    enabled: true
    severity: error

  # Dist demo branches cover VG001-VG111.
  VG107:
    enabled: true
  VG108:
    enabled: true
